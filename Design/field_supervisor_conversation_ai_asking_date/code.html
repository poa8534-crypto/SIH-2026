<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Field Supervisor Conversation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline": "#727784",
                        "surface-bright": "#f9f9ff",
                        "on-surface": "#191c21",
                        "tertiary-fixed-dim": "#ffb694",
                        "surface-container-high": "#e7e8f0",
                        "tertiary": "#722b00",
                        "on-background": "#191c21",
                        "on-secondary-fixed": "#001b3e",
                        "primary-fixed-dim": "#acc7ff",
                        "surface-tint": "#115cb9",
                        "on-primary-container": "#bbd0ff",
                        "primary-fixed": "#d7e2ff",
                        "on-secondary-container": "#224b85",
                        "on-primary-fixed-variant": "#004491",
                        "on-tertiary-container": "#ffc2a7",
                        "surface": "#f9f9ff",
                        "outline-variant": "#c2c6d4",
                        "on-tertiary-fixed": "#351000",
                        "error": "#ba1a1a",
                        "inverse-primary": "#acc7ff",
                        "surface-container-low": "#f2f3fc",
                        "tertiary-fixed": "#ffdbcc",
                        "primary-container": "#0056b3",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "tertiary-container": "#983c00",
                        "surface-container-lowest": "#ffffff",
                        "surface-variant": "#e1e2ea",
                        "inverse-surface": "#2e3037",
                        "surface-container-highest": "#e1e2ea",
                        "secondary-fixed-dim": "#aac7ff",
                        "surface-dim": "#d9d9e2",
                        "surface-container": "#ededf6",
                        "secondary-container": "#98bcfe",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "secondary-fixed": "#d6e3ff",
                        "primary": "#003f87",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "secondary": "#385e9a",
                        "on-surface-variant": "#424752",
                        "inverse-on-surface": "#f0f0f9",
                        "on-secondary-fixed-variant": "#1c4681",
                        "on-primary-fixed": "#001a40",
                        "on-tertiary-fixed-variant": "#7b2f00",
                        "background": "#f9f9ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "gutter": "16px",
                        "unit": "4px",
                        "stack-lg": "32px",
                        "container-padding": "24px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "headline-md": ["Inter"],
                        "display-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .waveform-bar {
            width: 4px;
            background-color: #003f87; /* primary */
            border-radius: 9999px;
            animation: waveform 1.2s ease-in-out infinite alternate;
        }
        @keyframes waveform {
            0% { height: 4px; }
            100% { height: 24px; }
        }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.3s; }
        .delay-3 { animation-delay: 0.5s; }
        .delay-4 { animation-delay: 0.2s; }
        .delay-5 { animation-delay: 0.4s; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background h-full flex flex-col font-body-lg antialiased overflow-hidden" style="max-width: 390px; margin: 0 auto; position: relative;">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-on-surface border-b border-outline-variant dark:border-outline flex items-center justify-between px-container-padding h-16 z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="construction">construction</span>
<span class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">NAVIS</span>
</div>
<div class="flex items-center gap-4 text-on-surface-variant dark:text-surface-variant">
<!-- Add context actions if needed, keeping simple per spec -->
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col overflow-y-auto bg-background px-gutter py-stack-md gap-stack-md" style="padding-bottom: 220px;">
<!-- Conversation Container -->
<div class="flex flex-col gap-stack-lg flex-1">
<!-- User Message (Right Aligned) -->
<div class="flex flex-col items-end w-full">
<span class="font-label-md text-label-md text-on-surface-variant mb-unit">Field Supervisor</span>
<div class="bg-surface border border-outline-variant rounded-lg p-stack-md max-w-[85%] text-on-background font-body-lg shadow-sm">
                    spool erection on the 24 inch header is done
                </div>
</div>
<!-- System Message (Left Aligned) -->
<div class="flex flex-col items-start w-full">
<span class="font-label-md text-label-md text-primary mb-unit font-bold">NAVIS Assistant</span>
<div class="bg-primary-fixed border border-primary-fixed-dim rounded-lg p-stack-md max-w-[85%] text-on-primary-fixed font-body-lg shadow-sm">
                    Which date was it completed?
                </div>
</div>
</div>
</main>
<!-- Fixed Bottom Interaction Area -->
<div class="fixed bottom-20 w-full bg-surface-bright border-t border-outline-variant px-gutter py-stack-md flex flex-col gap-stack-md shadow-[0_-4px_12px_rgba(0,0,0,0.05)] z-40" style="max-width: 390px; left: 50%; transform: translateX(-50%);">
<!-- Active Status & Waveform -->
<div class="flex items-center justify-between w-full">
<div class="flex items-center gap-stack-sm">
<div class="flex items-end h-6 gap-[2px]">
<div class="waveform-bar h-[8px] delay-1"></div>
<div class="waveform-bar h-[16px] delay-2"></div>
<div class="waveform-bar h-[24px] delay-3"></div>
<div class="waveform-bar h-[12px] delay-4"></div>
<div class="waveform-bar h-[18px] delay-5"></div>
</div>
<span class="font-label-md text-label-md text-primary font-bold">NAVIS Assistant is speaking</span>
</div>
<button class="p-2 rounded-full hover:bg-surface-container-low transition-colors duration-200 text-on-surface-variant border border-outline-variant bg-surface flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="replay" style="font-size: 20px;">replay</span>
</button>
</div>
<!-- Voice Button -->
<button class="w-full bg-primary text-on-primary font-body-lg font-medium py-3 rounded-lg flex items-center justify-center gap-2 hover:bg-primary-container transition-colors shadow-sm">
<span class="material-symbols-outlined" data-icon="mic" data-weight="fill" style="font-variation-settings: 'FILL' 1;">mic</span>
            Answer by Voice
        </button>
<!-- Text Input -->
<div class="relative w-full">
<input class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-3 font-body-md text-on-background placeholder:text-on-surface-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" placeholder="Type your answer" type="text"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-primary hover:text-primary-container p-1 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="send">send</span>
</button>
</div>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center h-20 px-gutter bg-surface dark:bg-on-surface border-t border-outline-variant dark:border-outline" style="max-width: 390px; left: 50%; transform: translateX(-50%);">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant hover:bg-surface-container-high dark:hover:bg-surface-dim scale-95 transition-transform duration-100 p-2 rounded-lg w-16">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-label-md text-label-md">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant hover:bg-surface-container-high dark:hover:bg-surface-dim scale-95 transition-transform duration-100 p-2 rounded-lg w-16">
<span class="material-symbols-outlined mb-1" data-icon="analytics">analytics</span>
<span class="font-label-md text-label-md">Reports</span>
</button>
<!-- Active Nav Item -->
<button class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed-dim font-bold hover:bg-surface-container-high dark:hover:bg-surface-dim scale-95 transition-transform duration-100 p-2 rounded-lg w-16">
<span class="material-symbols-outlined mb-1" data-icon="chat_bubble_outline" data-weight="fill" style="font-variation-settings: 'FILL' 1;">chat_bubble_outline</span>
<span class="font-label-md text-label-md">Clarifications</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant hover:bg-surface-container-high dark:hover:bg-surface-dim scale-95 transition-transform duration-100 p-2 rounded-lg w-16">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-label-md text-label-md">Profile</span>
</button>
</nav>
</body></html>
