<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />
  
  <!-- NAVIS Compass / EPC Derrick Symbol -->
  <g transform="translate(256, 256)">
    <!-- Outer ring / radar indicator -->
    <circle r="180" fill="none" stroke="#1E293B" stroke-width="10" />
    <circle r="140" fill="none" stroke="#2563EB" stroke-width="5" stroke-dasharray="20 16" opacity="0.4" />
    
    <!-- Derrick / Gantt geometric node -->
    <polygon points="0,-128 100,96 -100,96" fill="none" stroke="url(#primaryGrad)" stroke-width="16" stroke-linejoin="round" />
    <line x1="-60" y1="16" x2="60" y2="16" stroke="url(#primaryGrad)" stroke-width="14" />
    <line x1="-32" y1="-48" x2="32" y2="-48" stroke="url(#primaryGrad)" stroke-width="10" />
    
    <!-- Central pulse indicator -->
    <circle cx="0" cy="-16" r="22" fill="url(#goldGrad)" />
    <line x1="0" y1="-16" x2="0" y2="96" stroke="#F59E0B" stroke-width="8" />
  </g>
</svg>
