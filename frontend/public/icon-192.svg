<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />
  <rect width="190" height="190" x="1" y="1" rx="41" fill="none" stroke="#334155" stroke-width="2" opacity="0.6" />
  
  <!-- NAVIS Compass / EPC Derrick Symbol -->
  <g transform="translate(96, 96)">
    <!-- Outer ring / radar indicator -->
    <circle r="68" fill="none" stroke="#1E293B" stroke-width="4" />
    <circle r="52" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />
    
    <!-- Derrick / Gantt geometric node -->
    <polygon points="0,-48 38,36 -38,36" fill="none" stroke="url(#primaryGrad)" stroke-width="6" stroke-linejoin="round" />
    <line x1="-22" y1="6" x2="22" y2="6" stroke="url(#primaryGrad)" stroke-width="5" />
    <line x1="-12" y1="-18" x2="12" y2="-18" stroke="url(#primaryGrad)" stroke-width="4" />
    
    <!-- Central pulse indicator -->
    <circle cx="0" cy="-6" r="8" fill="url(#goldGrad)" />
    <line x1="0" y1="-6" x2="0" y2="36" stroke="#F59E0B" stroke-width="3" />
  </g>
</svg>
